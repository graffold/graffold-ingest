[project]
name = "graffold-ingest"
version = "0.2.0"
description = "Domain-agnostic knowledge graph ingestion — extract, resolve, publish"
authors = [{name = "Graffold", email = "dev@graffold.com"}]
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyarrow>=15.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
llm = ["boto3>=1.34", "openai>=1.0"]
scrape = ["playwright>=1.40"]
graph = ["neo4j>=6.2.0", "graspologic-native>=1.0", "boto3>=1.34"]
gcp = ["google-cloud-spanner>=3.40.0"]
storage = ["duckdb>=0.10"]
resolvers = ["rapidfuzz>=3.0"]
all = ["graffold-ingest[llm,scrape,graph,gcp,storage,resolvers]"]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "ruff>=0.4", "rapidfuzz>=3.0"]

[project.scripts]
graffold-ingest = "graffold_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graffold_ingest"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
